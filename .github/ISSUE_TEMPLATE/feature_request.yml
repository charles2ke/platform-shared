name: Feature request
description: Propose a shared capability for auth, profiles, or notifications.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which consuming app (social, travel, workout, basa) needs this and why.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: js
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be implemented with Node built-ins only (no new runtime dependencies).
