name: Bug report
description: Report incorrect behavior in a shared module.
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - auth
        - profile
        - notifications
        - adapters
        - shared
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code sample or failing test.
      render: js
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report contains no secrets and is not a security vulnerability (report those privately instead).
          required: true
